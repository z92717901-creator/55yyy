<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>محادثة البوت</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 80vh;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    .header {
      background: #0ea5e9;
      color: #fff;
      padding: 16px;
      font-weight: bold;
      text-align: center;
      font-size: 18px;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .msg.user {
      align-self: flex-start;
      background: #0ea5e9;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot {
      align-self: flex-end;
      background: #334155;
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
    }
    .msg.error { background: #7f1d1d; color: #fecaca; }
    .input-bar {
      display: flex;
      padding: 10px;
      gap: 8px;
      background: #0f172a;
      border-top: 1px solid #334155;
    }
    #input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 14px;
    }
    #send {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #0ea5e9;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    #send:hover { background: #0284c7; }
    .status {
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      padding: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">🤖 محادثة البوت</div>
    <div class="status" id="status">جارٍ الاتصال...</div>
    <div id="chat"></div>
    <div class="input-bar">
      <input id="input" type="text" placeholder="اكتب رسالتك..." autocomplete="off" />
      <button id="send">إرسال</button>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const status = document.getElementById('status');

    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}`);

    ws.onopen = () => {
      status.textContent = '🟢 متصل';
      status.style.color = '#4ade80';
    };

    ws.onclose = () => {
      status.textContent = '🔴 غير متصل - أعد تحميل الصفحة';
      status.style.color = '#f87171';
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'bot') addMessage(data.text, 'bot');
      if (data.type === 'error') addMessage(data.text, 'error');
    };

    function addMessage(text, who) {
      const div = document.createElement('div');
      div.className = `msg ${who}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      if (ws.readyState !== WebSocket.OPEN) {
        addMessage('لا يوجد اتصال بالخادم', 'error');
        return;
      }
      addMessage(text, 'user');
      ws.send(JSON.stringify({ text }));
      input.value = '';
      input.focus();
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
